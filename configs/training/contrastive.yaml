# Contrastive reward
# Rewards distinctive but related embeddings

lr: 1.0e-4
gamma: 0.99
value_coef: 0.5
entropy_coef: 0.01
grad_clip: 0.5
warmup_steps: 5

reward:
  type: "pure_embedding"

  # Focus on contrast between sequential embeddings
  predictability_weight: 0.1
  information_weight: 0.5
  compression_weight: 0.1
  diversity_weight: 0.2
  temporal_weight: 0.1
